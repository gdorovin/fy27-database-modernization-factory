name: Docs

on:
  push:
    branches: [main]
    paths: ["**/*.md", "**/*.yml", "**/*.yaml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**/*.md", "**/*.yml", "**/*.yaml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Markdown and YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install markdownlint
        run: npm install --no-save markdownlint-cli2@0.14.0
      - name: Lint Markdown
        run: npx markdownlint-cli2 "**/*.md" "#node_modules" "#scenarios/*/expected"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install yamllint
        run: python -m pip install yamllint
      - name: Lint YAML
        run: yamllint -c .yamllint.yml .github playbooks scenarios templates

  links:
    name: Internal links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check relative links
        # Only relative links are checked. External URLs are not fetched: a CI job that
        # depends on someone else's uptime fails for reasons unrelated to the change.
        run: python scripts/check_links.py

  consistency:
    name: Docs match the implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: README commands exist, tree matches, claims are dated
        run: dbmodernize validate-repo
