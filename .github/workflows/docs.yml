name: Docs

on:
  push:
    branches: [main]
    paths: ["**/*.md", "**/*.yml", "**/*.yaml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**/*.md", "**/*.yml", "**/*.yaml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Markdown and YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
      - name: Install markdownlint
        run: npm install --no-save markdownlint-cli2@0.14.0
      - name: Lint Markdown
        run: npx markdownlint-cli2 "**/*.md" "#node_modules" "#scenarios/*/expected"
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install yamllint
        run: python -m pip install yamllint
      - name: Lint YAML
        run: yamllint -c .yamllint.yml .github playbooks scenarios templates

  links:
    name: Internal links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Check relative links
        # Only relative links are checked. External URLs are not fetched: a CI job that
        # depends on someone else's uptime fails for reasons unrelated to the change.
        run: python scripts/check_links.py

  consistency:
    name: Docs match the implementation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: README commands exist, tree matches, claims are dated
        run: dbmodernize validate-repo
