name: Scenario evaluations

# Deliberately NOT a merge gate.
#
# Model-based evaluation is non-deterministic. Gating merges on it would make the build
# flaky and teach people to re-run until green, which is worse than not evaluating at all.
# The merge gate is the deterministic rules and the golden scenarios in ci.yml.
#
# This workflow runs on demand and on a schedule, and reports trends.

on:
  workflow_dispatch:
    inputs:
      rubric:
        description: Rubric to run, or "all"
        required: false
        default: all
  schedule:
    - cron: "23 5 * * 2"

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic-evals:
    name: Deterministic scenario evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Scenario acceptance criteria
        run: dbmodernize validate-scenario scenarios --json
      - name: Rubric coverage
        # Checks that every rubric dimension is exercised by at least one scenario. This
        # part is deterministic and is genuinely useful without a model.
        run: python -m pytest tests/evals -q

  model-evals:
    name: Model-based evaluation
    runs-on: ubuntu-latest
    # Requires a configured model endpoint. Absent one, the job reports and exits cleanly
    # rather than failing, because an unavailable optional integration is not a defect.
    environment: evaluation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Check for an evaluator configuration
        id: check
        run: |
          if [ -z "${DBMODERNIZE_EVAL_ENDPOINT:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No evaluator endpoint configured. Skipping model-based evaluation."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          DBMODERNIZE_EVAL_ENDPOINT: ${{ vars.DBMODERNIZE_EVAL_ENDPOINT }}
      - name: Run rubrics
        if: steps.check.outputs.configured == 'true'
        # The evaluator configuration must differ from the generation configuration. A model
        # grading its own output measures self-consistency, not quality.
        run: python -m pytest tests/evals -m model_eval -q
        env:
          DBMODERNIZE_EVAL_ENDPOINT: ${{ vars.DBMODERNIZE_EVAL_ENDPOINT }}
          DBMODERNIZE_EVAL_MODEL: ${{ vars.DBMODERNIZE_EVAL_MODEL }}
      - name: Upload results
        if: steps.check.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-results
          path: tests/evals/results/
          if-no-files-found: ignore
