name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # The core pipeline is offline by design. If a job ever needs network access to pass,
  # that is a defect in the change, not a reason to widen the job.
  DBMODERNIZE_OFFLINE: "1"

jobs:
  quality:
    name: Format, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Format check
        run: python -m ruff format --check src tests scripts
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Type check
        run: python -m mypy

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit, contract, and security tests
        run: python -m pytest tests/unit tests/contract tests/security -q
      - name: Repository, skill, agent, and playbook tests
        run: python -m pytest tests/repository tests/skills tests/agents tests/playbooks -q
      - name: Integration and scenario tests
        run: python -m pytest tests/integration tests/scenarios -q

  validators:
    name: Deterministic validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Repository structure and safety
        run: dbmodernize validate-repo
      - name: Default playbook
        run: dbmodernize validate-playbook playbooks/default
      - name: Example playbooks
        run: |
          for playbook in playbooks/examples/*/; do
            echo "::group::${playbook}"
            dbmodernize validate-playbook "${playbook}"
            echo "::endgroup::"
          done
      - name: Agent Skills
        run: dbmodernize validate-skill .github/skills
      - name: Agent definitions
        run: dbmodernize validate-agent .github/agents
      - name: Scenarios against committed expectations
        run: dbmodernize validate-scenario scenarios

  determinism:
    name: Output is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Regenerate scenario expectations
        run: dbmodernize validate-scenario scenarios --update
      - name: Fail if anything changed
        # Identical inputs must produce byte-identical outputs. A diff here means something
        # non-deterministic leaked in: a timestamp, a set iteration, or a locale.
        run: |
          if ! git diff --quiet; then
            echo "::error::Regenerating produced a diff. Output is not deterministic."
            git --no-pager diff --stat
            git --no-pager diff | head -n 200
            exit 1
          fi
          echo "Output is byte-identical on regeneration."

  bicep:
    name: Bicep compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Bicep
        run: |
          curl -fsSL https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64 -o bicep
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version
      # Compilation only. This repository has no credentials and deploys nothing.
      - name: Build
        run: bicep build infra/bicep/main.bicep --stdout > /dev/null
      - name: Lint
        run: bicep lint infra/bicep/main.bicep

  gate:
    name: Merge gate
    runs-on: ubuntu-latest
    needs: [quality, tests, validators, determinism, bicep]
    steps:
      - name: All required checks passed
        run: echo "Gate satisfied."
