name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Full gate before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Formatting, lint, types
        run: |
          python -m ruff format --check src tests scripts
          python -m ruff check src tests scripts
          python -m mypy
      - name: Tests
        run: python -m pytest -q
      - name: Validators
        run: |
          dbmodernize validate-repo
          dbmodernize validate-playbook playbooks/default
          dbmodernize validate-skill .github/skills
          dbmodernize validate-agent .github/agents
          dbmodernize validate-scenario scenarios
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import dbmodernize; print(dbmodernize.__version__)')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${tag} does not match package version ${pkg}."
            exit 1
          fi
      - name: Changelog has an entry for this version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[${tag}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${tag}]' section."
            exit 1
          fi

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Verify the wheel installs and the CLI runs
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install dist/*.whl
          /tmp/verify/bin/dbmodernize version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
    permissions:
      contents: write
      # Required for attestation. No long-lived credential is used anywhere in this
      # repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file <(python scripts/extract_changelog.py "${GITHUB_REF_NAME#v}") \
            dist/*
