[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "fy27-database-modernization-factory"
version = "0.1.0"
description = "Guided, evidence-based database modernization factory for Azure. Docs-first, schema-first, offline-deterministic."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "FY27 Database Modernization Factory maintainers" }]
keywords = ["azure", "sql", "migration", "modernization", "copilot", "agents"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12,<1.0",
  "pydantic>=2.7,<3.0",
  "jsonschema>=4.22,<5.0",
  "PyYAML>=6.0,<7.0",
  "Jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "pre-commit>=3.7",
]

[project.scripts]
dbmodernize = "dbmodernize.cli:run"

[project.urls]
Documentation = "./docs/index.md"

[tool.hatch.build.targets.wheel]
packages = ["src/dbmodernize"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = [
  "S101",  # pytest relies on assert
  "RET504",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "S105", "S106"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
packages = ["dbmodernize"]
mypy_path = "src"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["jsonschema.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "slow: long-running tests, excluded from the fast gate",
  "optional_integration: requires an optional external dependency; never in default CI",
  "model_eval: requires a language model; never a merge gate",
]

[tool.coverage.run]
source = ["src/dbmodernize"]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
