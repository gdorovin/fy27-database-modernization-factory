target_first_workload_live: 2026-11-30

desired_outcomes:
  - Ship product changes weekly instead of monthly, without a database change becoming the bottleneck.
  - Stop over-provisioning for a peak that happens four times a year.
  - Give the product team a data foundation they can build features on without asking for infrastructure.

business_context: >-
  A software product company whose application was written in the last three years and holds
  no instance-scoped database dependencies. Growth is uneven and the current fixed
  provisioning is sized for the worst week of the year.

scope:
  in_scope:
    - Product application databases
    - Tenant metadata database
  out_of_scope:
    - Billing, which is a third-party service
  estate_summary: Four databases behind one application, all on one instance.
  estimated_workload_count: 4
  estimated_count_is_assumption: false

constraints:
  - id: c-tenant-isolation
    category: technical
    statement: Tenant data must remain separable at database level for contractual reasons.
    hard: true
    source: Application owner, architecture review

