repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-json
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-secrets-in-fixtures
        name: no secrets or real connection strings in tracked content
        entry: python scripts/check_no_secrets.py
        language: system
        pass_filenames: true

      - id: validate-repository
        name: repository structure and safety validation
        entry: python scripts/validate_repository.py
        language: system
        pass_filenames: false
