# GitHub issue definitions
#
# Generated by `dbmodernize generate-issues` and written to disk. Live creation is a
# separate, explicitly confirmed step, so a dry run can never surprise a repository with
# fifty new issues.
#
# Validated against contracts/github-issue.schema.json.

engagement_id: REPLACE-ENGAGEMENT-ID
issues:
  - id: issue-example-dependency-mapping
    title: Complete dependency mapping for Example workload
    engagement_id: REPLACE-ENGAGEMENT-ID
    workload_ids:
      - wl-example
    problem_statement: >-
      Consumers of this database are unknown, which blocks a target recommendation and makes
      the cutover blast radius unknowable.
    source_evidence:
      - ev-example
    approved_target: null
    target_decision_id: null
    playbook:
      path: playbooks/default
      version: 1.0.0
    dependencies: []
    scope:
      - Enumerate inbound and outbound dependencies.
      - Confirm each consumer with its application owner.
    out_of_scope:
      - Remediating any dependency that is found.
      - Selecting a target; no recommendation is produced while this blocker is open.
    acceptance_criteria:
      - Every dependency is recorded as confirmed, or captured as an explicit open question.
      - dependency_discovery_complete is true for the workload.
    validation_commands:
      - dbmodernize assess --engagement input/engagement.yaml --input input --out out
      - dbmodernize validate-repo
    security_considerations:
      - No credential, connection string, or customer identifier may appear in this issue.
    rollback_considerations: []
    owner_role: application-owner
    labels:
      - assessment
      - blocker
      - dependency
    milestone: null
    blocked_by: []
    definition_of_done:
      - Workload artifact updated and schema-valid.
      - Evidence reference recorded for the new information.
      - Assessment re-run shows the workload is recommendation-ready.
